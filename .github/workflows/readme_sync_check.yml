name: README Synchronization Verification

on:
  push:
    branches: [ main, master ]
    paths:
      - '**/*.py'
      - '**/README.md'
      - 'configs/**'
      - 'ops/tools/maintenance/sync_folder_readmes.py'
      - 'docs/README_INDEX.md'
      - '.github/workflows/readme_sync_check.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - '**/*.py'
      - '**/README.md'
      - 'configs/**'
      - 'ops/tools/maintenance/sync_folder_readmes.py'
      - 'docs/README_INDEX.md'
      - '.github/workflows/readme_sync_check.yml'

permissions:
  contents: read

jobs:
  verify-readme-sync:
    name: Verify README Freshness
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Verify README Freshness (Read-Only Check)
        run: |
          python ops/tools/maintenance/sync_folder_readmes.py --check
