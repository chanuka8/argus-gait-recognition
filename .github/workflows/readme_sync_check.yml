name: README Synchronization Verification

on:
  push:
    branches: [ main, master ]
    paths:
      - '**/*.py'
      - '**/README.md'
      - 'configs/**'
      - 'scripts/sync_folder_readmes.py'
      - 'docs/README_INDEX.md'
      - '.github/workflows/readme_sync_check.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - '**/*.py'
      - '**/README.md'
      - 'configs/**'
      - 'scripts/sync_folder_readmes.py'
      - 'docs/README_INDEX.md'
      - '.github/workflows/readme_sync_check.yml'

jobs:
  verify-readme-sync:
    name: Verify README Freshness
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify README Freshness (Read-Only Check)
        run: |
          python scripts/sync_folder_readmes.py --check
