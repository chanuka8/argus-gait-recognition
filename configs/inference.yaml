camera_index: 0
evaluation_threshold: 0.75
live_threshold: 0.85
security_threshold: 0.90

matching_policy:
  confirmed_threshold: 0.92
  verify_low: 0.85
  verify_high: 0.92
  low_confidence_low: 0.70
  low_confidence_high: 0.85
  unknown_ceiling: 0.70
  centroid_threshold: 0.85
  margin: 0.05
  top_k: 5
  min_stable_votes: 3
  history_size: 10

crowd_control:
  enabled: true
  max_tracked_people_per_camera: 50
  max_recognitions_per_frame: 3
  recognition_queue_size: 100
  track_timeout_frames: 90
  min_box_height: 60
  min_box_area_ratio: 0.003
  priority_update_interval: 10
  alert_cooldown_seconds: 5
  disable_debug_windows: true

box_stability:
  enabled: true
  ema_alpha: 0.35
  min_detection_confidence: 0.35
  min_iou_keep: 0.25
  max_missed_frames: 8
  max_jump_ratio: 0.35
  use_stable_box_for_display: true
  use_stable_box_for_silhouette: true
  prune_after_frames: 30

display:
  enabled: true
  show_camera_id: true
  show_track_id: true
  show_score: true
  line_thickness: 2
  font_scale: 0.6
  colors:
    detection: [0, 0, 255]
    tracking: [0, 165, 255]
    unknown: [0, 0, 255]
    uncertain: [0, 215, 255]
    confirmed: [0, 255, 0]

reporting:
  enabled: true
  output_dir: outputs/media/detections
  save_jsonl: true
  save_csv: true
  save_snapshots: true
  snapshot_dir: outputs/media/detections/snapshots
  cooldown_seconds: 10
  report_detection: false
  report_tracking: false
  report_unknown: true
  report_uncertain: true
  report_confirmed: true

reid:
  enabled: false
  model_path: "models/weights/osnet_x0_25.pth"
  device: "auto"
  batch_size: 8
  similarity_threshold: 0.6

gait_3d:
  enabled: false
  pose_model_path: "models/weights/yolov8n-pose.pt"
  model_path: "models/weights/gait3d_pose_lifter.pth"
  sequence_length: 30
  confidence_threshold: 0.30
  device: "auto"

fusion:
  enabled: false
  gait_weight: 0.7
  reid_weight: 0.3

dual_modal_fusion:
  enabled: false
  gait_weight: 0.70
  appearance_weight: 0.30
  adaptive_weighting: true
  appearance_update_interval: 8

gei_quality:
  enabled: true
  quality_threshold: 0.6

temporal_verification:
  enabled: true
  window_size: 3

open_set:
  enabled: true
  known_threshold: 0.85
  unknown_threshold: 0.70
  margin_threshold: 0.05
  quality_threshold: 0.60

silhouette:
  method: "learned"
  model_path: "models/weights/silhouette_segmenter.onnx"
  threshold: 0.5
  target_size: [64, 128]

track_reliability:
  enabled: false
  target_observation_frames: 15
  min_reliability_threshold: 0.50
  weights:
    quality: 0.25
    temporal: 0.25
    open_set: 0.25
    observation: 0.15
    detection: 0.10

watchlist:
  enabled: false
  alert_threshold: 0.85
  cooldown_seconds: 10.0

crowd_robustness:
  enabled: false
  strong_overlap_iou: 0.25
  occlusion_overlap_threshold: 0.35
  density_thresholds:
    moderate_count: 5
    high_count: 12
    severe_count: 20
    moderate_overlap_count: 1
    high_overlap_count: 4
    severe_overlap_count: 8
    moderate_area_ratio: 0.15
    high_area_ratio: 0.30
    severe_area_ratio: 0.50
  adaptive_gating:
    high_density_quality_penalty: 0.10
    severe_density_margin_boost: 0.05

crowd_intelligence:
  enabled: false

  occlusion:
    enabled: false
    smoothing_window: 5
    moderate_threshold: 0.35
    high_threshold: 0.60
    severe_threshold: 0.80
    minimum_clean_frames: 18
    minimum_clean_ratio: 0.70

  recognition_deferral:
    enabled: false
    evidence_window: 5
    minimum_confirmations: 3
    minimum_reliability: 0.70
    evidence_ttl_seconds: 10
    identity_ttl_seconds: 5

  multi_camera_fusion:
    enabled: false
    evidence_ttl_seconds: 15
    minimum_cameras: 2
    minimum_fused_score: 0.85
    weights:
      gait: 0.30
      appearance: 0.15
      open_set: 0.15
      temporal: 0.15
      reliability: 0.15
      transition: 0.10

  topology_learning:
    enabled: false
    shadow_mode: true
    minimum_samples: 20
    maximum_travel_seconds: 600
    export_path: outputs/reports/exports/learned_camera_topology.yaml

explainable_reporting:
  enabled: false
  output_dir: outputs/reports/explainable
  formats:
    - json
    - csv
    - markdown
  report_confirmed: true
  report_deferred: true
  report_watchlist: true
  duplicate_cooldown_seconds: 10

event_timeline:
  enabled: false
  output_dir: outputs/reports/timelines
  formats:
    - json
    - csv
    - markdown
  export_on_track_close: true
  export_on_watchlist: true
  retention_seconds: 3600
  maximum_events_per_track: 500

inference_backend:
  backend: pytorch
  device: auto
  precision: fp32
  model_path: "models/candidates/exp_003e_hpp_arcface_triplet025_best.pth"
  engine_path: models/engines/bygait_light_fp16.engine
  onnx_path: models/engines/bygait_light.onnx
  allow_fallback: true
  warmup_iterations: 3
  dynamic_batch: false
  max_batch_size: 1
